<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful HTML Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #764ba2;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            border-color: #764ba2;
            outline: none;
            box-shadow: 0 0 8px #c4b5fd;
        }

        .section {
            background-color: #f3f0ff;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .section p {
            font-weight: bold;
            color: #5b21b6;
        }

        input[type="radio"],
        input[type="checkbox"] {
            accent-color: #764ba2;
            margin-right: 6px;
        }

        .option {
            margin: 10px 0;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: linear-gradient(135deg, #4f46e5, #6d28d9);
            transform: scale(1.02);
        }

        footer {
            text-align: center;
            color: gray;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌟 HTML Form</h1>

        <form action="https://www.google.com/search" method="get">

            <label for="search">Search:</label>
            <input type="text" id="search" name="q" placeholder="Enter your search">

            <label for="name">Your Name:</label>
            <input type="text" id="name" placeholder="Enter your name">

            <div class="section">
                <p>Subscription Plan</p>

                <div class="option">
                    <input type="radio" id="basic" name="plan" value="basic">
                    <label for="basic">Basic</label>
                </div>

                <div class="option">
                    <input type="radio" id="premium" name="plan" value="premium">
                    <label for="premium">Premium</label>
                </div>

                <div class="option">
                    <input type="radio" id="pro" name="plan" value="pro">
                    <label for="pro">Pro</label>
                </div>
            </div>

            <div class="section">
                <p>Choose Your Favorite Color</p>

                <div class="option">
                    <input type="checkbox" id="red" name="color" value="red">
                    <label for="red">Red</label>
                </div>

                <div class="option">
                    <input type="checkbox" id="green" name="color" value="green">
                    <label for="green">Green</label>
                </div>

                <div class="option">
                    <input type="checkbox" id="blue" name="color" value="blue">
                    <label for="blue">Blue</label>
                </div>
            </div>

            <label for="country">Select Your Country:</label>
            <select id="country" name="country">
                <option value="">-- Select Country --</option>
                <option value="usa">USA</option>
                <option value="canada">Canada</option>
                <option value="uk">UK</option>
                <option value="australia">Australia</option>
                <option value="india">India</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" placeholder="Enter your message here"></textarea>

            <button type="submit">Submit Form 🚀</button>

        </form>

        <footer>
            Created with HTML & CSS ❤️
        </footer>

    </div>

</body>
</html>
