<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricket Legends</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #101935, #163c59, #087e8b);
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 750px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(15px);
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.2);
}

h1 {
    text-align: center;
    color: #fff;
    font-size: 32px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #b8e8f5;
    margin-bottom: 30px;
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 12px;
}

th {
    background: #ffb703;
    color: #14213d;
    padding: 16px;
    font-size: 16px;
}

td {
    padding: 20px 15px;
    text-align: center;
    color: white;
    background: rgba(255,255,255,0.12);
    font-size: 17px;
    font-weight: 600;
}

td:first-child {
    border-radius: 12px 0 0 12px;
    text-align: left;
}

td:last-child {
    border-radius: 0 12px 12px 0;
}

tbody tr {
    transition: 0.3s ease;
}

tbody tr:hover {
    transform: scale(1.03);
}

.sachin td {
    background: linear-gradient(90deg, #e63946, #f77f00);
}

.dhoni td {
    background: linear-gradient(90deg, #007f5f, #38b000);
}

.score {
    font-size: 21px;
    color: #fff;
}

.footer {
    text-align: center;
    color: #d5f3ff;
    margin-top: 25px;
    font-size: 13px;
}

@media(max-width: 500px) {
    .container {
        padding: 15px;
    }

    h1 {
        font-size: 24px;
    }

    td, th {
        padding: 13px 7px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🏏 Cricket Legends</h1>
    <p class="subtitle">The Pride of Indian Cricket</p>

    <table>
        <thead>
            <tr>
                <th>Player Name</th>
                <th>match</th>
                <th>Runs</th>
                <th>six</th>
            </tr>
        </thead>

        <tbody>
            <tr class="sachin">
                <td>⭐ Sachin Tendulkar</td>
                <td>match="456</td>
                <td class="score">18427</td>
                <td>709</td>
            </tr>

            <tr class="dhoni">
                <td>🏆 MS Dhoni</td>
                <td>match="450"</td>
                <td class="score">10773</td>
                <td>603</td>
            </tr>
             <tr class="virat">
                <td>⭐ virat Kohli</td>
                <td>match="556"</td>
                <td class="score">18427</td>
                <td>609</td>
            </tr>

            <tr class="rohit">
                <td>🏆 rohit sharma</td>
                <td>match="500"</td>
                <td class="score">10773</td>
                <td>758</td>
            </tr>
        </tbody>
    </table>

    <div class="footer">
        © 2026 | Indian Cricket Legends ❤️
    </div>

</div>

</body>
</html>
</body>
</html>
